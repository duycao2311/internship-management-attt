{% extends 'base.html' %}
{% block content %}
<div class="mt-4">
  <h2>Department Dashboard</h2>
  <p>Welcome, <strong>{{ request.user.username }}</strong> (Role: {{ request.user.get_role_display }})</p>
  <div class="card-placeholder">
    <!-- Thành viên team có thể thêm card, widget, hoặc bảng dữ liệu tại đây -->
    Thêm nội dung/tiện ích cho khoa tại đây
  </div>
  {# Block mở rộng cho các thành phần dashboard #}
  {% block department_extra %}{% endblock %}
</div>
{% endblock %}
