{% extends 'base.html' %}
{% block extra_css %}<link rel="stylesheet" href="/static/css/dashboard.css">{% endblock %}
{% block content %}
<div class="dashboard-header text-center mt-4 mb-4">
  <img src="/static/images/logo-ptit.jpg" alt="PTIT Logo" height="60" class="me-2">
  <img src="/static/images/logo-attt.jpg" alt="ATTT Logo" height="60">
  <h2 class="mt-3">Welcome, {{ request.user.username }}!</h2>
  <p>Your role: <strong>{{ request.user.get_role_display }}</strong></p>
</div>
<div class="text-center">
  <a href="{% url 'logout' %}" class="btn btn-secondary mt-3">Logout</a>
</div>
{% endblock %}
