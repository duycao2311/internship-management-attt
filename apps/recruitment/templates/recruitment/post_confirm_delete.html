{% extends 'base.html' %}
{% block title %}Xác nhận xoá tin tuyển dụng{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Xác nhận xoá</h4>
            </div>
            <div class="card-body">
                <p>Bạn có chắc chắn muốn xoá tin tuyển dụng <strong>"{{ post.title }}"</strong> không?</p>
                <p class="text-muted small">Hành động này không thể hoàn tác.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Xác nhận Xoá</button>
                        <a href="{% url 'recruitment:department_post_list' %}" class="btn btn-secondary">Huỷ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
